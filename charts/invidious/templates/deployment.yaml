---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "invidious.fullname" . }}
  labels:
    app: {{ template "invidious.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ template "invidious.name" . }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "invidious.name" . }}
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        release: {{ .Release.Name }}
    spec:
      {{- if .Values.podSecurityContext }}
      securityContext:
{{ toYaml .Values.podSecurityContext | indent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-database
          image: postgres:14
          args:
            - /bin/sh
            - -c
            - |
              {{- if .Values.database.internal.enabled }}
              until pg_isready -h {{ template "invidious.fullname" . }}-postgresql -p 5432 -U {{ .Values.database.auth.username }}; do
              {{- else }}
              until pg_isready -h {{ .Values.database.external.host }} -p {{ .Values.database.external.port }} -U {{ .Values.database.auth.username }}; do
              {{- end }}
                echo "Waiting for database..."; sleep 2;
              done;
      containers:
        - name: invidious
          image: "{{ .Values.images.invidious.registry }}/{{ .Values.images.invidious.image }}"
          imagePullPolicy: {{ .Values.images.invidious.pullPolicy }}
          ports:
            - containerPort: 3000
          env:
            - name: INVIDIOUS_CONFIG
              valueFrom:
                configMapKeyRef:
                  key: INVIDIOUS_CONFIG
                  name: {{ template "invidious.fullname" . }}
          {{- if .Values.securityContext }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          {{- end }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
          # readinessProbe:
          #   httpGet:
          #     port: 3000
          #     path: /api/v1/trending
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          #   timeoutSeconds: 5
          # livenessProbe:
          #   httpGet:
          #     port: 3000
          #     path: /api/v1/trending
          #   initialDelaySeconds: 30
          #   periodSeconds: 30
          #   timeoutSeconds: 5
          #   failureThreshold: 2
      restartPolicy: Always
