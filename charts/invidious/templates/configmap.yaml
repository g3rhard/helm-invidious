---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ template "invidious.fullname" . }}
  labels:
    app: {{ template "invidious.name" . }}
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
data:
  INVIDIOUS_CONFIG: |
    channel_threads: {{ .Values.config.channel_threads | default 1 }}
    feed_threads: {{ .Values.config.feed_threads | default 1 }}
    db:
      user: {{ .Values.database.auth.username | default "kemal" }}
      password: {{ .Values.database.auth.password | default "kemal" }}
      {{- if .Values.database.internal.enabled }}
      host: {{ template "invidious.fullname" . }}-postgresql
      {{- else }}
      host: {{ .Values.database.external.host }}
      {{- end }}
      port: {{ .Values.database.external.port | default 5432 }}
      dbname: {{ .Values.database.auth.database | default "invidious" }}
    check_tables: {{ .Values.config.check_tables | default true }}
    full_refresh: {{ .Values.config.full_refresh | default false }}
    https_only: {{ .Values.config.https_only | default false }}
    {{- if .Values.config.domain }}
    domain: {{ .Values.config.domain }}
    {{- end }}
    {{- if .Values.config.external_port }}
    external_port: {{ .Values.config.external_port }}
    {{- end }}
    # CRITICAL: Must be set to a random value
    hmac_key: {{ .Values.config.hmac_key | default "CHANGE_ME_GENERATE_RANDOM_16_CHARS" }}
    # Performance optimizations for public instances
    use_pubsub_feeds: {{ .Values.config.use_pubsub_feeds | default true }}
    use_innertube_for_captions: {{ .Values.config.use_innertube_for_captions | default true }}
    invidious_companion:
      # Private URL for internal communication
      {{- if .Values.companion.enabled }}
      - private_url: {{ .Values.config.invidious_companion.private_url | default (printf "http://%s-companion:8282/companion" (include "invidious.fullname" .)) }}
      {{- else }}
      - private_url: {{ .Values.config.invidious_companion.private_url | default "http://companion:8282/companion" }}
      {{- end }}
      {{- if .Values.config.invidious_companion.public_url }}
      # Optional: Public URL for direct access via reverse proxy
      - public_url: {{ .Values.config.invidious_companion.public_url }}
      {{- end }}
    # CRITICAL: Must be different from hmac_key
    invidious_companion_key: {{ .Values.config.invidious_companion_key | default "CHANGE_ME_GENERATE_RANDOM_16_CHARS" }}
    log_level: {{ .Values.config.log_level | default "Info" }}
