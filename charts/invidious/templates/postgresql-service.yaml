{{- if .Values.database.internal.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ template "invidious.fullname" . }}-postgresql
  labels:
    app: {{ template "invidious.name" . }}-postgresql
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    component: postgresql
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    app: {{ template "invidious.name" . }}-postgresql
    release: {{ .Release.Name }}
    component: postgresql
{{- end }}
