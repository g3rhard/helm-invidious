{{- if .Values.database.internal.enabled }}
{{- $dbImage := .Values.database.image | default .Values.database.internal.image }}
{{- $dbResources := .Values.database.resources | default .Values.database.internal.resources }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ template "invidious.fullname" . }}-postgresql
  labels:
    app: {{ template "invidious.name" . }}-postgresql
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    release: {{ .Release.Name }}
    component: postgresql
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "invidious.name" . }}-postgresql
      release: {{ .Release.Name }}
      component: postgresql
  template:
    metadata:
      labels:
        app: {{ template "invidious.name" . }}-postgresql
        chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
        release: {{ .Release.Name }}
        component: postgresql
    spec:
      {{- if .Values.podSecurityContext }}
      securityContext:
        # PostgreSQL requires specific user/group (999)
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        {{- with .Values.podSecurityContext }}
        runAsNonRoot: {{ .runAsNonRoot | default true }}
        {{- if .seccompProfile }}
        seccompProfile:
          type: {{ .seccompProfile.type }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: postgresql
          image: "{{ $dbImage.registry }}/{{ $dbImage.repository }}:{{ $dbImage.tag }}"
          imagePullPolicy: {{ $dbImage.pullPolicy | default "IfNotPresent" }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.keys.databaseUsername }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: {{ .Values.secret.keys.databasePassword }}
            - name: POSTGRES_DB
              value: {{ .Values.database.auth.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          {{- if .Values.securityContext }}
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          {{- end }}
          volumeMounts:
            - name: postgresql-data
              mountPath: /var/lib/postgresql/data
            - name: postgresql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{- if $dbResources }}
          resources:
{{ toYaml $dbResources | indent 12 }}
          {{- end }}
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgresql-data
          {{- if .Values.database.internal.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ template "invidious.fullname" . }}-postgresql-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: postgresql-init
          configMap:
            name: {{ template "invidious.fullname" . }}-postgresql-init
            items:
              - key: playlists.sql
                path: 01-playlists.sql
              - key: playlist_videos.sql
                path: 02-playlist-videos.sql
              - key: annotations.sql
                path: 03-annotations.sql
              - key: channels.sql
                path: 04-channels.sql
              - key: channel_videos.sql
                path: 05-channel-videos.sql
              - key: nonces.sql
                path: 06-nonces.sql
              - key: session_ids.sql
                path: 07-session-ids.sql
              - key: users.sql
                path: 08-users.sql
              - key: videos.sql
                path: 09-videos.sql
      restartPolicy: Always
{{- end }}
