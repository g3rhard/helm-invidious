name: invidious

images:
  invidious:
    registry: quay.io
    repository: invidious/invidious
    tag: 2.20260723.0
    digest: ""
    pullPolicy: IfNotPresent
  companion:
    registry: quay.io
    repository: invidious/invidious-companion
    tag: latest
    digest: ""
    pullPolicy: Always
  materialious:
    registry: docker.io
    repository: wardpearce/materialious
    tag: latest
    digest: ""
    pullPolicy: Always

replicaCount: 1

# Existing Kubernetes Secret consumed directly by the Deployments. The chart
# does not create or encrypt secrets.
secret:
  name: invidious-secrets
  keys:
    # Generate a database password with: openssl rand -hex 32
    databaseUsername: db_user
    databasePassword: db_password
    # CRITICAL: Generate using: pwgen 20 1
    # The referenced value MUST be a random 20-character value.
    hmacKey: hmac_key
    # po_token and visitor_data are a related pair; obtain them together using
    # the current upstream Invidious/companion instructions, not randomly.
    poToken: po_token
    visitorData: visitor_data
    # CRITICAL: Generate using: pwgen 16 1
    # The referenced value MUST be different from hmacKey.
    companionKey: invidious_companion_key

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

services:
  invidious:
    enabled: true
    type: ClusterIP
    port: 3000
    #loadBalancerIP:
  companion:
    enabled: true # Set to false if using external companion
    type: ClusterIP
    port: 8282
    #loadBalancerIP:
  materialious:
    enabled: false # Set to true to enable Materialious frontend
    type: ClusterIP
    port: 80
    #loadBalancerIP:

# Resource configuration for Invidious pods
# Set to non-empty to apply resource requests/limits
# Example:
#   requests:
#     cpu: 500m
#     memory: 1Gi
#   limits:
#     cpu: 2000m
#     memory: 4Gi
resources: {}

probes:
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Security context for containers
# Set to non-empty to apply container-level security hardening
# Example:
#   allowPrivilegeEscalation: false
#   runAsUser: 1000
#   runAsGroup: 1000
#   runAsNonRoot: true
#   capabilities:
#     drop:
#       - ALL
#   seccompProfile:
#     type: RuntimeDefault
securityContext: {}

# Pod security context
# Set to non-empty to apply pod-level security hardening
# Example:
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault
podSecurityContext: {}

# Database configuration
database:
  # Set to false to use external database
  internal:
    enabled: true
    image:
      registry: docker.io
      repository: postgres
      tag: "18"
      pullPolicy: IfNotPresent

    # Persistence configuration
    persistence:
      enabled: true
      size: 5Gi
      # storageClass: ""

    # Resource configuration for PostgreSQL
    # Set to non-empty to apply resource requests/limits
    # Example:
    #   requests:
    #     memory: 2Gi
    #     cpu: 500m
    #   limits:
    #     memory: 4Gi
    #     cpu: 2000m
    resources: {}

  # Database authentication (used for both internal and external)
  auth:
    database: invidious

  # External database configuration (when internal.enabled: false)
  external:
    host: ""
    port: 5432 # Adapted from ../config/config.yml

config:
  channel_threads: 1
  feed_threads: 1
  db:
    username: dbusername
    password: dbpassword
    host: invidious-postgresql
    port: 5432
    dbname: invidious
  check_tables: true
  full_refresh: false
  https_only: false
  domain: ""
  # Performance optimizations for public instances
  use_pubsub_feeds: true
  use_innertube_for_captions: true
  invidious_companion: []

# Companion configuration
companion:
  enabled: true # Set to false if using external companion
  replicaCount: 1

  # Optional resource allocation for companion
  # Uncomment and adjust based on your needs
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 200m
  #     memory: 256Mi

  # Optional health probes for companion
  # Uncomment and adjust based on your needs
  # livenessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 30
  #   periodSeconds: 30
  # readinessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10

# Materialious configuration (optional modern material design frontend)
# Enable by setting services.materialious.enabled: true
materialious:
  enabled: false # Set to true to deploy Materialious

  # Optional resource limits for Materialious
  # Uncomment and adjust based on your needs
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  # Optional health probes for Materialious
  # Uncomment and adjust based on your needs
  # readinessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10
  # livenessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 15
  #   periodSeconds: 30

  # Materialious environment configuration
  config:
    # URL to your Invidious instance (will be auto-configured if not set)
    # VITE_DEFAULT_INVIDIOUS_INSTANCE: "https://invidious.example.com"

    # URL to your Companion instance (will be auto-configured if not set)
    # VITE_DEFAULT_COMPANION_INSTANCE: "https://companion.example.com"

    # Return YouTube Dislikes API
    VITE_DEFAULT_RETURNYTDISLIKES_INSTANCE: https://returnyoutubedislikeapi.com

    # SponsorBlock API
    VITE_DEFAULT_SPONSERBLOCK_INSTANCE: https://sponsor.ajay.app

    # DeArrow API
    VITE_DEFAULT_DEARROW_INSTANCE: https://sponsor.ajay.app

    # DeArrow thumbnail instance
    VITE_DEFAULT_DEARROW_THUMBNAIL_INSTANCE: https://dearrow-thumb.ajay.app

    # Default settings (JSON string)
    # See: https://github.com/Materialious/Materialious/blob/main/docs/SETTINGS.md
    VITE_DEFAULT_SETTINGS: '{"themeColor": "#2596be","region": "US"}'

# Ingress configuration for external access
ingress:
  # Invidious ingress configuration
  invidious:
    enabled: false # Set to true to enable ingress for Invidious
    className: "" # Specify ingress class (e.g., "nginx", "traefik")

    # Ingress annotations (controller-specific)
    annotations: {}
      # For nginx ingress controller:
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

      # For Traefik ingress controller:
      # traefik.ingress.kubernetes.io/router.tls: "true"
      # cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - host: invidious.example.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: invidious-tls-secret # Name of your existing TLS secret
        hosts:
          - invidious.example.com

  # Materialious ingress configuration (optional)
  materialious:
    enabled: false # Set to true to enable ingress for Materialious
    className: "" # Specify ingress class (e.g., "nginx", "traefik")

    # Ingress annotations (controller-specific)
    annotations: {}
      # For nginx ingress controller:
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

      # For Traefik ingress controller:
      # traefik.ingress.kubernetes.io/router.tls: "true"
      # cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - host: materialious.example.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: materialious-tls-secret # Name of your existing TLS secret
        hosts:
          - materialious.example.com
