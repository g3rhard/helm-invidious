name: invidious

images:
  invidious:
    registry: quay.io
    image: invidious/invidious:latest
    pullPolicy: Always
  companion:
    registry: quay.io
    image: invidious/invidious-companion:latest
    pullPolicy: Always
  materialious:
    registry: docker.io
    image: wardpearce/materialious:latest
    pullPolicy: Always

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

services:
  invidious:
    enabled: true
    type: ClusterIP
    port: 3000
    #loadBalancerIP:
  companion:
    enabled: true  # Set to false if using external companion
    type: ClusterIP
    port: 8282
    #loadBalancerIP:
  materialious:
    enabled: false  # Set to true to enable Materialious frontend
    type: ClusterIP
    port: 80
    #loadBalancerIP:

# Resource recommendations based on documentation
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Security configuration
# Uncomment to enable security hardening features
# securityContext:
#   allowPrivilegeEscalation: false
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
#   runAsNonRoot: true
#   capabilities:
#     drop:
#       - ALL
#   seccompProfile:
#     type: RuntimeDefault

# # Pod security context
# # Uncomment to enable pod-level security hardening
# podSecurityContext:
#   runAsUser: 1000
#   runAsGroup: 1000
#   fsGroup: 1000
#   runAsNonRoot: true
#   seccompProfile:
#     type: RuntimeDefault

# Database configuration
database:
  # Set to false to use external database
  internal:
    enabled: true
    image:
      registry: docker.io
      repository: postgres
      tag: "14"
      pullPolicy: IfNotPresent

    # Resource recommendations from documentation
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m

    # Persistence configuration
    persistence:
      enabled: true
      size: 20Gi
      # storageClass: ""

  # Database authentication (used for both internal and external)
  auth:
    username: dbusername
    password: dbpassword
    database: invidious

  # External database configuration (when internal.enabled: false)
  external:
    host: ""
    port: 5432 # Adapted from ../config/config.yml
config:
  channel_threads: 1
  feed_threads: 1
  db:
    username: dbusername
    password: dbpassword
    host: invidious-postgresql
    port: 5432
    dbname: invidious
  check_tables: true
  full_refresh: false
  https_only: false
  domain: ""
  # CRITICAL: Generate using: pwgen 16 1
  hmac_key: CHANGE_ME_GENERATE_RANDOM_16_CHARS
  # Performance optimizations for public instances
  use_pubsub_feeds: true
  use_innertube_for_captions: true
  invidious_companion:
    # Internal URL for communication between invidious and companion
    private_url: "http://companion:8282/companion"
    # Optional: public_url for direct companion access via reverse proxy
    # public_url: "https://MYDOMAIN/companion"
  # CRITICAL: Generate a different key than hmac_key using: pwgen 16 1
  invidious_companion_key: CHANGE_ME_GENERATE_RANDOM_16_CHARS

# Companion configuration
companion:
  enabled: true  # Set to false if using external companion

  # Optional resource allocation for companion
  # Uncomment and adjust based on your needs
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 200m
  #     memory: 256Mi

  # Optional health probes for companion
  # Uncomment and adjust based on your needs
  # livenessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 30
  #   periodSeconds: 30
  # readinessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10

# Materialious configuration (optional modern material design frontend)
# Enable by setting services.materialious.enabled: true
materialious:
  enabled: false  # Set to true to deploy Materialious

  # Optional resource limits for Materialious
  # Uncomment and adjust based on your needs
  # resources:
  #   requests:
  #     cpu: 100m
  #     memory: 128Mi
  #   limits:
  #     cpu: 500m
  #     memory: 512Mi

  # Optional health probes for Materialious
  # Uncomment and adjust based on your needs
  # readinessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10
  # livenessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 15
  #   periodSeconds: 30

  # Materialious environment configuration
  config:
    # URL to your Invidious instance (will be auto-configured if not set)
    # VITE_DEFAULT_INVIDIOUS_INSTANCE: "https://invidious.example.com"

    # URL to your Companion instance (will be auto-configured if not set)
    # VITE_DEFAULT_COMPANION_INSTANCE: "https://companion.example.com"

    # Return YouTube Dislikes API
    VITE_DEFAULT_RETURNYTDISLIKES_INSTANCE: https://returnyoutubedislikeapi.com

    # SponsorBlock API
    VITE_DEFAULT_SPONSERBLOCK_INSTANCE: https://sponsor.ajay.app

    # DeArrow API
    VITE_DEFAULT_DEARROW_INSTANCE: https://sponsor.ajay.app

    # DeArrow thumbnail instance
    VITE_DEFAULT_DEARROW_THUMBNAIL_INSTANCE: https://dearrow-thumb.ajay.app

    # Default settings (JSON string)
    # See: https://github.com/Materialious/Materialious/blob/main/docs/SETTINGS.md
    VITE_DEFAULT_SETTINGS: '{"themeColor": "#2596be","region": "US"}'

# Ingress configuration for external access
ingress:
  # Invidious ingress configuration
  invidious:
    enabled: false  # Set to true to enable ingress for Invidious
    className: ""   # Specify ingress class (e.g., "nginx", "traefik")

    # Ingress annotations (controller-specific)
    annotations: {}
      # For nginx ingress controller:
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

      # For Traefik ingress controller:
      # traefik.ingress.kubernetes.io/router.tls: "true"
      # cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - host: invidious.example.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: invidious-tls-secret  # Name of your existing TLS secret
        hosts:
          - invidious.example.com

  # Materialious ingress configuration (optional)
  materialious:
    enabled: false  # Set to true to enable ingress for Materialious
    className: ""   # Specify ingress class (e.g., "nginx", "traefik")

    # Ingress annotations (controller-specific)
    annotations: {}
      # For nginx ingress controller:
      # kubernetes.io/ingress.class: nginx
      # cert-manager.io/cluster-issuer: letsencrypt-prod
      # nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

      # For Traefik ingress controller:
      # traefik.ingress.kubernetes.io/router.tls: "true"
      # cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - host: materialious.example.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: materialious-tls-secret  # Name of your existing TLS secret
        hosts:
          - materialious.example.com
