name: invidious

image:
  registry: quay.io
  image: invidious/invidious:2024.09.28-53e8a5d@sha256:ba98d3155da3bdf0d5e3344281070d85cdb9b3d5cd5fee22a629128a303c30a5
  pullPolicy: Always

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

service:
  type: ClusterIP
  port: 3000
  #loadBalancerIP:

resources: {}
  #requests:
  #  cpu: 100m
  #  memory: 64Mi
  #limits:
  #  cpu: 800m
  #  memory: 512Mi

securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# See https://github.com/bitnami/charts/tree/master/bitnami/postgresql
postgresql:
  image:
    tag: 14
  auth:
    username: kemal
    password: kemal
    database: invidious
  primary:
    initdb:
      username: kemal
      password: kemal
      scriptsConfigMap: invidious-postgresql-init

# Adapted from ../config/config.yml
config:
  channel_threads: 1
  feed_threads: 1
  db:
    user: kemal
    password: kemal
    host: invidious-postgresql
    port: 5432
    dbname: invidious
  full_refresh: false
  https_only: false
  domain:
  signature_server: inv-sig-helper:12999
