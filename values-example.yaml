name: invidious

# Container images - using official Quay.io repository
images:
  invidious:
    registry: quay.io
    image: invidious/invidious:2.20260723.0
    pullPolicy: IfNotPresent
  companion:
    registry: quay.io
    image: invidious/invidious-companion:latest
    pullPolicy: Always
  materialious:
    registry: docker.io
    image: wardpearce/materialious:latest
    pullPolicy: Always

# Number of replicas
replicaCount: 1

# Existing Kubernetes Secret. Creation and encryption are outside this chart.
secret:
  name: invidious-secrets
  keys:
    # Generate a database password with: openssl rand -hex 32
    databaseUsername: db_user
    databasePassword: db_password
    # Generate independent HMAC and companion keys with: pwgen 16 1
    hmacKey: hmac_key
    # Obtain po_token and visitor_data together using the current upstream
    # Invidious/companion instructions; they are not random secrets.
    poToken: po_token
    visitorData: visitor_data
    # The referenced companion key must be exactly 16 characters long.
    companionKey: invidious_companion_key

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

# Service configuration
services:
  invidious:
    enabled: true
    type: ClusterIP
    port: 3000
    #loadBalancerIP:
  companion:
    enabled: true # Set to false if using external companion
    type: ClusterIP
    port: 8282
    #loadBalancerIP:
  materialious:
    enabled: false # Set to true to enable Materialious frontend
    type: ClusterIP
    port: 80
    #loadBalancerIP:

# Resource recommendations based on documentation
# Minimum: 2GB RAM, adjust based on your needs
# Public instances: 4GB RAM recommended
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Probes use the lightweight root endpoint and protect slow database migrations.
probes:
  startup:
    enabled: true
    periodSeconds: 5
    failureThreshold: 30
  readiness:
    enabled: true
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  liveness:
    enabled: true
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3

# Security context for containers
securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Pod security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Database configuration
database:
  # Set to false to use external database
  internal:
    enabled: true
    image:
      registry: docker.io
      repository: postgres
      tag: "18"
      pullPolicy: IfNotPresent

    # Resource recommendations from documentation
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m

    # Persistence configuration
    persistence:
      enabled: true
      size: 20Gi
      # storageClass: ""

  # Database authentication (used for both internal and external)
  auth:
    database: invidious

  # External database configuration (when internal.enabled: false)
  external:
    host: ""
    port: 5432 # Invidious configuration
# Adapted from config/config.yml
config:
  # Basic threading configuration
  channel_threads: 1
  feed_threads: 1

  # Database initialization
  check_tables: true

  # Basic settings
  full_refresh: false
  https_only: false

  # Domain configuration (set for production)
  domain:
  # external_port: 443  # Set to 443 if using HTTPS

  # Performance optimizations for public instances
  use_pubsub_feeds: true
  use_innertube_for_captions: true

  # Invidious companion configuration
  invidious_companion:
    - private_url: "http://invidious-invidious-companion:8282/companion"
      # Optional: expose companion directly through a reverse proxy.
      # public_url: "https://MYDOMAIN/companion"

# Example production configuration (commented out)
# Uncomment and adjust for production deployments
#
# config:
#   https_only: true
#   domain: "invidious.example.com"
#   external_port: 443
#   invidious_companion:
#     - private_url: "http://companion:8282/companion"
#     public_url: "https://invidious.example.com/companion"

# Companion configuration
companion:
  enabled: true
  replicaCount: 1

  # Optional resource allocation for companion
  # Uncomment and adjust based on your monitoring and requirements
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # Optional health probes for companion
  # Uncomment and adjust based on your requirements
  # livenessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 30
  #   periodSeconds: 30
  # readinessProbe:
  #   httpGet:
  #     port: 8282
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10

# Materialious configuration (optional modern material design frontend)
# Enable by setting services.materialious.enabled: true
materialious:
  enabled: false # Set to true to deploy Materialious

  # Optional resource limits for Materialious
  # Uncomment and adjust based on your monitoring and requirements
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Optional health probes for Materialious
  # Uncomment and adjust based on your requirements
  # readinessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 5
  #   periodSeconds: 10
  # livenessProbe:
  #   httpGet:
  #     port: 80
  #     path: /
  #   initialDelaySeconds: 15
  #   periodSeconds: 30

  # Materialious environment configuration
  config:
    # URL to your Invidious instance (will be auto-configured if not set)
    # VITE_DEFAULT_INVIDIOUS_INSTANCE: "https://invidious.example.com"

    # URL to your Companion instance (will be auto-configured if not set)
    # VITE_DEFAULT_COMPANION_INSTANCE: "https://companion.example.com"

    # Return YouTube Dislikes API
    VITE_DEFAULT_RETURNYTDISLIKES_INSTANCE: "https://returnyoutubedislikeapi.com"

    # SponsorBlock API
    VITE_DEFAULT_SPONSERBLOCK_INSTANCE: "https://sponsor.ajay.app"

    # DeArrow API
    VITE_DEFAULT_DEARROW_INSTANCE: "https://sponsor.ajay.app"

    # DeArrow thumbnail instance
    VITE_DEFAULT_DEARROW_THUMBNAIL_INSTANCE: "https://dearrow-thumb.ajay.app"

    # Default settings (JSON string)
    # See: https://github.com/Materialious/Materialious/blob/main/docs/SETTINGS.md
    VITE_DEFAULT_SETTINGS: '{"themeColor": "#2596be","region": "US"}'

# Ingress configuration examples for external access
ingress:
  # Invidious ingress configuration
  invidious:
    enabled: true # Enable ingress for Invidious
    className: "nginx" # Use nginx ingress controller

    # Nginx ingress controller annotations
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "50m"
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"

    hosts:
      - host: invidious.yourdomain.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: invidious-tls-secret # Your existing TLS secret
        hosts:
          - invidious.yourdomain.com

  # Materialious ingress configuration (optional frontend)
  materialious:
    enabled: false # Set to true if you want to expose Materialious
    className: "nginx" # Use nginx ingress controller

    # Nginx ingress controller annotations
    annotations:
      kubernetes.io/ingress.class: nginx
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"

    hosts:
      - host: materialious.yourdomain.com
        paths:
          - path: /
            pathType: Prefix

    # TLS configuration using externally created secret
    tls:
      - secretName: materialious-tls-secret # Your existing TLS secret
        hosts:
          - materialious.yourdomain.com

