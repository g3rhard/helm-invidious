name: invidious

# Container images - using official Quay.io repository
images:
  invidious:
    registry: quay.io
    image: invidious/invidious:latest
    pullPolicy: Always
  companion:
    registry: quay.io
    image: invidious/invidious-companion:latest
    pullPolicy: Always
  materialious:
    registry: docker.io
    image: wardpearce/materialious:latest
    pullPolicy: Always

# Number of replicas
replicaCount: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 16
  targetCPUUtilizationPercentage: 50

# Service configuration
services:
  invidious:
    enabled: true
    type: ClusterIP
    port: 3000
    #loadBalancerIP:
  materialious:
    enabled: false  # Set to true to enable Materialious frontend
    type: ClusterIP
    port: 80
    #loadBalancerIP:

# Resource recommendations based on documentation
# Minimum: 2GB RAM, adjust based on your needs
# Public instances: 4GB RAM recommended
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 2000m
    memory: 4Gi

# Security context for containers
securityContext:
  allowPrivilegeEscalation: false
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Pod security context
podSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# PostgreSQL configuration
# See https://github.com/bitnami/charts/tree/master/bitnami/postgresql
postgresql:
  image:
    tag: 14
  auth:
    username: kemal
    password: kemal
    database: invidious
  primary:
    initdb:
      username: kemal
      password: kemal
      scriptsConfigMap: invidious-postgresql-init
  # Resource recommendations from documentation
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"  
      cpu: "2000m"

# Invidious configuration
# Adapted from config/config.yml
config:
  # Basic threading configuration
  channel_threads: 1
  feed_threads: 1
  
  # Database configuration
  db:
    user: kemal
    password: kemal
    host: invidious-postgresql
    port: 5432
    dbname: invidious
  
  # Database initialization
  check_tables: true
  
  # Basic settings
  full_refresh: false
  https_only: false
  
  # Domain configuration (set for production)
  domain:
  # external_port: 443  # Set to 443 if using HTTPS
  
  # CRITICAL: Generate using: pwgen 20 1
  # This MUST be set to a random 20-character value
  hmac_key: "CHANGE_ME_GENERATE_RANDOM_20_CHARS"
  
  # Performance optimizations for public instances
  use_pubsub_feeds: true
  use_innertube_for_captions: true
  
  # Invidious companion configuration
  invidious_companion:
    # Internal URL for communication between invidious and companion
    private_url: "http://companion:8282/companion"
    # Optional: public_url for direct companion access via reverse proxy
    # Uncomment and configure if you want direct access
    # public_url: "https://MYDOMAIN/companion"
  
  # CRITICAL: Generate using: pwgen 16 1
  # This MUST be different from hmac_key
  invidious_companion_key: "CHANGE_ME_GENERATE_RANDOM_16_CHARS"

# Example production configuration (commented out)
# Uncomment and adjust for production deployments
#
# config:
#   https_only: true
#   domain: "invidious.example.com"
#   external_port: 443
#   hmac_key: "your_generated_20_char_key"
#   invidious_companion_key: "your_generated_16_char_key"
#   invidious_companion:
#     private_url: "http://companion:8282/companion"
#     public_url: "https://invidious.example.com/companion"

# Materialious configuration (optional modern material design frontend)
# Enable by setting services.materialious.enabled: true
materialious:
  enabled: false  # Set to true to deploy Materialious
  
  # Resource limits for Materialious
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  
  # Materialious environment configuration
  config:
    # URL to your Invidious instance (will be auto-configured if not set)
    # VITE_DEFAULT_INVIDIOUS_INSTANCE: "https://invidious.example.com"
    
    # URL to your Companion instance (will be auto-configured if not set)  
    # VITE_DEFAULT_COMPANION_INSTANCE: "https://companion.example.com"
    
    # Return YouTube Dislikes API
    VITE_DEFAULT_RETURNYTDISLIKES_INSTANCE: "https://returnyoutubedislikeapi.com"
    
    # SponsorBlock API
    VITE_DEFAULT_SPONSERBLOCK_INSTANCE: "https://sponsor.ajay.app"
    
    # DeArrow API
    VITE_DEFAULT_DEARROW_INSTANCE: "https://sponsor.ajay.app"
    
    # DeArrow thumbnail instance
    VITE_DEFAULT_DEARROW_THUMBNAIL_INSTANCE: "https://dearrow-thumb.ajay.app"
    
    # Default settings (JSON string)
    # See: https://github.com/Materialious/Materialious/blob/main/docs/SETTINGS.md
    VITE_DEFAULT_SETTINGS: '{"themeColor": "#2596be","region": "US"}'